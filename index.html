<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05050b">
<title>二次元拼图 · NEON SLIDE</title>
<style>
:root{--bg:#05050b;--cy:#00f0ff;--mg:#ff2bd6;--yl:#f9f871;--g:#39ff14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#f5f7ff;overflow-x:hidden;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(55% 50% at 10% 0%,rgba(255,43,214,.18),transparent 65%),
    radial-gradient(55% 55% at 95% 100%,rgba(0,240,255,.16),transparent 65%),
    linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);
  background-size:auto,auto,64px 64px,64px 64px;
  mask-image:radial-gradient(85% 85% at 50% 40%,#000 30%,transparent 100%);
  -webkit-mask-image:radial-gradient(85% 85% at 50% 40%,#000 30%,transparent 100%)}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px)}
.app{position:relative;z-index:2;max-width:1160px;margin:0 auto;min-height:100vh;
  padding:clamp(14px,2.4vh,26px) clamp(14px,2.6vw,34px) 24px;display:flex;flex-direction:column}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-bottom:1px solid rgba(0,240,255,.22);padding-bottom:10px}
.k{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.32em;color:rgba(0,240,255,.7)}
h1{margin:4px 0 0;font-size:clamp(22px,3.2vw,38px);font-weight:900;line-height:1;letter-spacing:-.02em;
  text-shadow:0 0 18px rgba(255,43,214,.5),0 0 48px rgba(0,240,255,.3)}
h1 em{font-style:normal;color:var(--cy)}
.stats{display:flex;gap:clamp(12px,2vw,26px)}
.stat{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.stat span{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.2em;color:rgba(245,247,255,.42)}
.stat b{font-family:ui-monospace,monospace;font-size:clamp(15px,1.7vw,21px);font-weight:700;line-height:1}
.stat.hot b{color:var(--yl);text-shadow:0 0 14px rgba(249,248,113,.6)}

.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,300px);
  gap:clamp(16px,2.4vw,38px);align-items:center;padding:clamp(10px,2vh,22px) 0}
.board-box{display:grid;place-items:center}
.board{position:relative;width:min(100%,min(72vh,620px));aspect-ratio:1/1;
  display:grid;gap:4px;padding:6px;border-radius:18px;
  background:linear-gradient(160deg,rgba(30,30,52,.9),rgba(8,8,16,.96));
  border:1px solid rgba(0,240,255,.22);
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 24px 60px rgba(0,0,0,.6)}
.tile{position:relative;border-radius:7px;cursor:pointer;overflow:hidden;
  background-repeat:no-repeat;border:1px solid rgba(255,255,255,.08);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.4),box-shadow .16s,filter .16s;
  will-change:transform}
.tile:active{transform:scale(.96)}
.tile.movable:hover{box-shadow:0 0 0 2px var(--cy) inset,0 0 18px rgba(0,240,255,.45)}
.tile.blank{background:rgba(255,255,255,.02);border:1px dashed rgba(0,240,255,.14);cursor:default}
.tile .n{position:absolute;left:4px;top:3px;font-family:ui-monospace,monospace;font-size:9px;
  color:rgba(255,255,255,.55);text-shadow:0 1px 4px #000;pointer-events:none}
.board.solved .tile{box-shadow:0 0 16px rgba(57,255,20,.45)}
.board.solved{animation:winpulse 1s ease}
@keyframes winpulse{0%{box-shadow:0 0 0 rgba(57,255,20,0)}50%{box-shadow:0 0 60px rgba(57,255,20,.55)}100%{box-shadow:0 0 0 rgba(57,255,20,0)}}

.side{display:flex;flex-direction:column;gap:14px}
.panel{border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(180deg,rgba(20,20,36,.85),rgba(10,10,20,.92))}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.18em;color:rgba(245,247,255,.55);
  font-family:ui-monospace,monospace;font-weight:600}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.12);
  aspect-ratio:4/5;background:#0b0b16;padding:0}
.chip img{width:100%;height:100%;object-fit:cover;display:block;opacity:.72;transition:opacity .2s,transform .3s}
.chip span{position:absolute;left:0;right:0;bottom:0;padding:10px 4px 4px;font-size:10px;font-weight:700;
  background:linear-gradient(180deg,transparent,rgba(4,4,10,.92));text-align:center}
.chip:hover img{opacity:.95;transform:scale(1.04)}
.chip.on{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy) inset,0 0 18px rgba(0,240,255,.4)}
.chip.on img{opacity:1}
.levels{display:flex;gap:8px}
.lv{flex:1;padding:9px 0;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#dfe7ff;transition:.2s}
.lv.on{background:linear-gradient(120deg,rgba(255,43,214,.3),rgba(0,240,255,.22));
  border-color:var(--cy);color:#fff;box-shadow:0 0 16px rgba(0,240,255,.25)}
.acts{display:flex;gap:8px}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:13px;
  padding:11px 16px;border-radius:10px;color:#0a0616;
  background:linear-gradient(120deg,var(--mg),#7a00ff 55%,var(--cy));
  box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 8px 24px rgba(255,43,214,.35);
  transition:transform .18s,box-shadow .18s;flex:1}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid rgba(0,240,255,.4);color:#dbe6ff;box-shadow:none}
.btn.ghost:hover{background:rgba(0,240,255,.12)}
.tips{font-family:ui-monospace,monospace;font-size:9.5px;line-height:1.9;letter-spacing:.08em;
  color:rgba(245,247,255,.4)}
.peek{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:18px;
  background:rgba(3,3,8,.9);backdrop-filter:blur(4px)}
.peek.show{display:grid}
.peek img{max-width:min(92vw,80vh);max-height:86vh;border-radius:14px;
  box-shadow:0 0 0 1px rgba(0,240,255,.4),0 30px 80px rgba(0,0,0,.8)}
.peek .lab{position:absolute;bottom:14px;font-family:ui-monospace,monospace;font-size:11px;
  letter-spacing:.2em;color:rgba(0,240,255,.8)}

.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;
  background:radial-gradient(60% 60% at 50% 45%,rgba(10,4,20,.86),rgba(3,3,8,.96));backdrop-filter:blur(6px)}
.overlay.show{display:grid;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.result{width:min(520px,100%);border-radius:22px;padding:clamp(22px,3.4vw,36px);text-align:center;
  border:1px solid rgba(0,240,255,.3);
  background:linear-gradient(165deg,rgba(24,20,44,.96),rgba(8,8,18,.98));
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 30px 90px rgba(0,0,0,.7),0 0 90px rgba(255,43,214,.18)}
.result .k2{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.34em;color:var(--cy)}
.result h2{margin:10px 0 4px;font-size:clamp(24px,3.6vw,36px);font-weight:900}
.result .rank{font-size:clamp(18px,2.4vw,24px);font-weight:900;color:var(--yl);
  text-shadow:0 0 22px rgba(249,248,113,.55);margin-bottom:16px}
.result .rows{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 22px}
.result .row{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.result .row span{display:block;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.18em;
  color:rgba(245,247,255,.45);margin-bottom:4px}
.result .row b{font-family:ui-monospace,monospace;font-size:clamp(18px,2.4vw,24px)}

@media (max-width:900px){
  .main{grid-template-columns:1fr;align-items:start;gap:14px}
  .board{width:min(100%,min(58vh,520px))}
  .side{flex-direction:row;flex-wrap:wrap}
  .panel{flex:1 1 200px}
  .chars{grid-template-columns:repeat(4,1fr)}
  .chip{aspect-ratio:1/1}
  .chip span{display:none}
}
@media (max-width:520px){
  h1{font-size:20px}
  .app{padding:12px 12px 18px}
  .board{width:min(100%,86vw)}
  .side{gap:10px}
  .panel{padding:10px;flex:1 1 100%}
  .tips{font-size:9px}
}
@media (max-height:560px) and (orientation:landscape){
  .main{grid-template-columns:auto 1fr;align-items:center}
  .board{width:min(78vh,420px)}
  h1{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="k">NEON SLIDE · 二次元拼图</div>
      <h1>把<em>她</em>拼回原样</h1>
    </div>
    <div class="stats">
      <div class="stat"><span>TIME</span><b id="time">0:00</b></div>
      <div class="stat hot"><span>MOVES</span><b id="moves">0</b></div>
      <div class="stat"><span>SIZE</span><b id="sizeLbl">3×3</b></div>
    </div>
  </header>

  <div class="main">
    <div class="board-box">
      <div class="board" id="board"></div>
    </div>

    <aside class="side">
      <div class="panel">
        <h3>SELECT CHARACTER</h3>
        <div class="chars" id="chars"></div>
      </div>
      <div class="panel">
        <h3>DIFFICULTY</h3>
        <div class="levels">
          <button class="lv on" data-n="3">3×3 简单</button>
          <button class="lv" data-n="4">4×4 困难</button>
        </div>
      </div>
      <div class="panel">
        <div class="acts">
          <button class="btn" id="shuffle">重新打乱 ↺</button>
          <button class="btn ghost" id="peekBtn">看原图 👁</button>
        </div>
      </div>
      <div class="panel">
        <div class="tips">
          <div>· 点击空白旁边的方块移动</div>
          <div>· 键盘方向键 / WASD 也可操作</div>
          <div>· 长按「看原图」随时参考</div>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="peek" id="peek">
  <img id="peekImg" alt="原图">
  <div class="lab">ORIGINAL · 原图参考</div>
</div>

<div class="overlay" id="overlay">
  <div class="result">
    <div class="k2">PUZZLE SOLVED</div>
    <h2>拼图完成</h2>
    <div class="rank" id="rank">S</div>
    <div class="rows">
      <div class="row"><span>TIME</span><b id="rTime">0:00</b></div>
      <div class="row"><span>MOVES</span><b id="rMoves">0</b></div>
    </div>
    <button class="btn" id="again">再拼一次 →</button>
  </div>
</div>

const pickKeys = ['reimu','miku','gojo','tanjiro'];
const charsEl = document.getElementById('chars');
const boardEl = document.getElementById('board');
const timeEl = document.getElementById('time');
const movesEl = document.getElementById('moves');
const sizeLbl = document.getElementById('sizeLbl');
const overlay = document.getElementById('overlay');
const peekEl = document.getElementById('peek');
const peekImg = document.getElementById('peekImg');

const S = { n:3, key:pickKeys[0], order:[], blank:0, moves:0, startAt:0, timerId:0, running:false, solved:false };

/* ---------- 角色选择 ---------- */
pickKeys.forEach((k, i) => {
  const b = document.createElement('button');
  b.className = 'chip' + (i === 0 ? ' on' : '');
  b.dataset.key = k;
  b.innerHTML = '<img src="' + ART[k].thumb + '" alt="' + ART[k].name + '"><span>' + ART[k].name + '</span>';
  b.addEventListener('click', () => {
    S.key = k;
    [...charsEl.children].forEach(c => c.classList.toggle('on', c === b));
    newGame();
  });
  charsEl.appendChild(b);
});

/* ---------- 棋盘渲染 ---------- */
function render(){
  const n = S.n, art = ART[S.key];
  boardEl.style.gridTemplateColumns = 'repeat(' + n + ',1fr)';
  boardEl.style.gridTemplateRows = 'repeat(' + n + ',1fr)';
  boardEl.innerHTML = '';
  S.order.forEach((val, pos) => {
    const d = document.createElement('div');
    d.className = 'tile' + (val === 0 ? ' blank' : '');
    if(val !== 0){
      const col = (val - 1) % n, row = Math.floor((val - 1) / n);
      d.style.backgroundImage = 'url("' + art.tile + '")';
      d.style.backgroundSize = (n * 100) + '% ' + (n * 100) + '%';
      d.style.backgroundPosition = (n > 1 ? (col / (n - 1) * 100) : 0) + '% ' +
                                   (n > 1 ? (row / (n - 1) * 100) : 0) + '%';
      d.innerHTML = '<span class="n">' + val + '</span>';
      if(isMovable(pos)) d.classList.add('movable');
      d.addEventListener('click', () => move(pos));
    }
    boardEl.appendChild(d);
  });
  movesEl.textContent = S.moves;
  sizeLbl.textContent = n + '×' + n;
}

function isMovable(pos){
  const n = S.n;
  const r = Math.floor(pos / n), c = pos % n;
  const br = Math.floor(S.blank / n), bc = S.blank % n;
  return Math.abs(r - br) + Math.abs(c - bc) === 1;
}

function move(pos){
  if(S.solved || !isMovable(pos)) return;
  if(!S.running) startClock();
  [S.order[S.blank], S.order[pos]] = [S.order[pos], S.order[S.blank]];
  S.blank = pos;
  S.moves++;
  render();
  if(isSolved()) finish();
}

function isSolved(){
  for(let i = 0; i < S.order.length - 1; i++){
    if(S.order[i] !== i + 1) return false;
  }
  return S.order[S.order.length - 1] === 0;
}

/* ---------- 打乱：随机合法移动，保证可解 ---------- */
function newGame(){
  const n = S.n;
  S.order = [];
  for(let i = 1; i < n * n; i++) S.order.push(i);
  S.order.push(0);
  S.blank = n * n - 1;
  S.moves = 0;
  S.solved = false;
  S.running = false;
  clearInterval(S.timerId);
  timeEl.textContent = '0:00';
  boardEl.classList.remove('solved');
  overlay.classList.remove('show');

  const steps = n === 3 ? 90 : 160;
  let last = -1;
  for(let i = 0; i < steps; i++){
    const cand = neighbors(S.blank).filter(p => p !== last);
    const pick = cand[Math.floor(Math.random() * cand.length)];
    last = S.blank;
    [S.order[S.blank], S.order[pick]] = [S.order[pick], S.order[S.blank]];
    S.blank = pick;
  }
  if(isSolved()) return newGame();
  render();
}

function neighbors(pos){
  const n = S.n, r = Math.floor(pos / n), c = pos % n, out = [];
  if(r > 0) out.push(pos - n);
  if(r < n - 1) out.push(pos + n);
  if(c > 0) out.push(pos - 1);
  if(c < n - 1) out.push(pos + 1);
  return out;
}

/* ---------- 计时 / 结算 ---------- */
function fmt(s){ const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); }
function startClock(){
  S.running = true;
  S.startAt = Date.now();
  clearInterval(S.timerId);
  S.timerId = setInterval(() => {
    timeEl.textContent = fmt(Math.floor((Date.now() - S.startAt) / 1000));
  }, 250);
}
function finish(){
  S.solved = true;
  clearInterval(S.timerId);
  const sec = Math.floor((Date.now() - S.startAt) / 1000);
  boardEl.classList.add('solved');
  document.getElementById('rTime').textContent = fmt(sec);
  document.getElementById('rMoves').textContent = S.moves;
  const base = S.n === 3 ? 60 : 180;
  let rank = 'C';
  if(S.moves <= base && sec <= base) rank = 'S';
  else if(S.moves <= base * 2 && sec <= base * 2.5) rank = 'A';
  else if(S.moves <= base * 4) rank = 'B';
  document.getElementById('rank').textContent = rank + ' 级';
  overlay.classList.add('show');
}

/* ---------- 绑定 ---------- */
document.querySelectorAll('.lv').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.lv').forEach(x => x.classList.toggle('on', x === b));
    S.n = +b.dataset.n;
    newGame();
  });
});
document.getElementById('shuffle').addEventListener('click', newGame);
document.getElementById('again').addEventListener('click', newGame);

let peekTimer = 0;
function openPeek(){
  peekImg.src = ART[S.key].tile;
  peekEl.classList.add('show');
}
function closePeek(){ peekEl.classList.remove('show'); }
const peekBtn = document.getElementById('peekBtn');
peekBtn.addEventListener('pointerdown', e => { e.preventDefault(); clearTimeout(peekTimer); openPeek(); });
['pointerup','pointerleave','pointercancel'].forEach(ev =>
  peekBtn.addEventListener(ev, () => closePeek()));
peekEl.addEventListener('click', closePeek);

document.addEventListener('keydown', e => {
  const map = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],
               w:[-1,0],s:[1,0],a:[0,-1],d:[0,1],W:[-1,0],S:[1,0],A:[0,-1],D:[0,1]};
  const v = map[e.key];
  if(!v) return;
  e.preventDefault();
  const n = S.n, r = Math.floor(S.blank / n), c = S.blank % n;
  const nr = r + v[0], nc = c + v[1];
  if(nr < 0 || nr >= n || nc < 0 || nc >= n) return;
  move(nr * n + nc);
});

newGame();
</script>
